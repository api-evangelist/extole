aid: extole
name: Extole
description: >-
  Extole is an enterprise referral, advocacy, and loyalty marketing platform that lets consumer
  brands run customer-acquisition programs powered by word-of-mouth. Its API surface spans four
  OpenAPI 3.0 specifications: a consumer-facing Integration API for advocate share links, referrals,
  and profiles; a server-side Integration API for rewards, persons, events, and files; and Management
  and Management Expert APIs for audiences, campaigns, components, zone rendering, reports, settings,
  and event webhooks. Authentication is token-based (Authorization header, extole_token cookie, or
  access_token query parameter) against api.extole.io, with first-party SDKs (iOS, Android, React
  Native), a developer CLI, published Postman collections, and an ISO 27001 / GDPR trust center.
  Extole also runs a first-party remote MCP server at mcp.extole.com — OAuth 2.1 with PKCE against
  idp.extole.com, 31 published toolsets — alongside published rate limits, a 90-code error registry,
  and a developer center at docs.extole.com. Surfaced originally as a Norwest Venture Partners
  portfolio lead and enriched from Extole's public developer surface.
url: https://raw.githubusercontent.com/api-evangelist/extole/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
