- scope: USER_SUPPORT
  description: Read access for support tooling.
  surface: rest
  schemes:
  - extole-api-token
  sources:
  - https://docs.extole.com/reference/authentication-overview
- scope: ANY
  description: Any authenticated scope; used on endpoints that only require a valid token.
  surface: rest
  schemes:
