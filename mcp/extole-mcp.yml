note: >-
  Extole ships a first-party REMOTE MCP server at https://mcp.extole.com, announced 2026 and documented
  at docs.extole.com. Confirmed live by probe: an unauthenticated POST of tools/list returns HTTP 401
  with an Extole error envelope (errorCode AUTHENTICATION_REQUIRED) and a WWW-Authenticate Bearer
  challenge naming realm mcp.extole.com and resource_metadata
  https://mcp.extole.com/.well-known/oauth-protected-resource. The tool list itself is therefore
  AUTH-GATED — tool names and inputSchemas require an authenticated tools/list call and are NOT recorded
  here. What IS anonymous and captured verbatim is the server's own toolset manifest at
  /.well-known/mcp (saved as mcp/extole-mcp-manifest.json), which enumerates 31 named toolset endpoints.
  This supersedes the 2026-07-19 derived candidate file, which wrongly recorded mode none.
server:
  name: extole
  transport: streamable-http
  url: https://mcp.extole.com
  manifest: https://mcp.extole.com/.well-known/mcp
  manifest_file: extole-mcp-manifest.json
deployment:
  mode: remote
  endpoint: https://mcp.extole.com
  auth: oauth
  verified: probed
authentication:
  methods:
  - kind: oauth
    spec: OAuth 2.1 authorization code with PKCE (S256)
    issuer: https://idp.extole.com
    authorization_endpoint: https://idp.extole.com/oauth2/authorize
    token_endpoint: https://idp.extole.com/oauth2/token
    scopes_supported:
    - openid
    - profile
    - email
    protected_resource_metadata: https://mcp.extole.com/.well-known/oauth-protected-resource
    note: Extole mints an access token bound to the signed-in Extole user; MCP calls run under that
      user's own Extole permissions and are attributed to them in the Extole change log.
  - kind: api-key
    scheme: Authorization Bearer
    note: A long-lived Access Token created in the My.Extole Security Center
      (https://my.extole.com/security-center#access-token) may be passed as
      "Authorization Bearer <token>" for clients that do not support OAuth, for CI/CD, or for service
      accounts. Actions then run under the token creator's permissions.
install:
- client: Claude Code
  command: claude mcp add --transport http extole https://mcp.extole.com
  source: https://docs.extole.com/docs/setup-claude-code
