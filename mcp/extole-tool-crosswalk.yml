method: derived
source: mcp/extole-mcp.yml (provider toolset manifest) + openapi/ (4 harvested OpenAPI 3.0.1 documents)
note: >-
  Extole runs BOTH a REST surface (4 OpenAPI 3.0.1 documents, api.extole.io / {brand}.extole.io) and a
  first-party remote MCP server (https://mcp.extole.com), so the crosswalk is warranted. It is however
  bound at TOOLSET granularity, not tool granularity, and that is a limitation of the provider's
  deployment rather than of this pass: an anonymous tools/list against mcp.extole.com returns HTTP 401
  AUTHENTICATION_REQUIRED, so no tool name, description or inputSchema is publicly knowable. What IS
  anonymous is /.well-known/mcp, which names 31 toolsets and describes each one. Every row below binds a
  named toolset to the OpenAPI operations that cover the same capability, with confidence set honestly —
  none is high, because no tool identity was ever observed. Nothing here asserts a tool that Extole did
  not name.
surfaces:
  openapi:
    files:
    - openapi/_original/extole-integration-consumer-to-extole-openapi.json
    - openapi/_original/extole-integration-server-to-extole-openapi.json
    - openapi/_original/extole-management-openapi.json
    - openapi/_original/extole-management-expert-openapi.json
    refined: openapi/extole-*-api-openapi.yml (43 one-per-tag documents)
    hosts:
    - https://api.extole.io
    - https://{brand}.extole.io
    gated: false
  mcp:
    url: https://mcp.extole.com
    manifest: https://mcp.extole.com/.well-known/mcp
    transport: streamable-http
    gated: true
    gate: OAuth 2.1 / PKCE at https://idp.extole.com, or a My.Extole bearer Access Token
    note: tools/list -> 401. Toolset names and descriptions are anonymous; tool identities are not.
  graphql:
    present: false
    note: https://api.extole.io/graphql returns 404 method_not_found.
