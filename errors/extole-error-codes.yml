handling_guidance:
- Branch on `code`. It is a stable string enum suitable for switch or pattern-match logic.
- Display `message` to humans where appropriate.
- Log `unique_id` and include it in any support ticket.
- Inspect `parameters` for sub-error details when present.
- For state-changing operations (POST, PATCH, PUT, DELETE) be cautious about retrying after a 5xx — the
  operation may have succeeded server-side even if the response did not return.
async_events:
  note: Consumer event endpoints (POST /events, GET /events/{event_name}) always return HTTP 200 to
    avoid blocking the participant's session, regardless of whether the event was processed
    successfully. Processing errors are surfaced in the response headers instead of the status line.
