note: >-
  Extole publishes a stable, string-enum error-code registry — the non-payments sibling of a decline-code
  table. This file captures the published registry verbatim. It COMPLEMENTS
  errors/extole-problem-types.yml, which is derived from the OpenAPI 4xx/5xx responses; where the two
  disagree the docs win, because the specs do not name codes. Extole does NOT use RFC 9457
  application/problem+json: the envelope is a bespoke application/json object. The `code` field is the
  contract — Extole documents it as a stable enum suitable for switch/pattern-match logic — while
  `message` is for humans and `unique_id` is the value to quote in a support ticket.
envelope:
  media_type: application/json
  example:
    unique_id: '6941049359794271324'
    http_status_code: 403
    code: missing_access_token
    message: No access_token was provided with this request.
    parameters: {}
  fields:
  - name: unique_id
    description: Unique identifier Extole logs against this error. Include it when contacting support.
  - name: http_status_code
    description: The HTTP status code returned. Mirrors the response status.
  - name: code
    description: Stable string enum identifying the error class. Use this for programmatic handling.
  - name: message
    description: Human-readable description. Intended for display or logs.
  - name: parameters
    description: Object containing sub-error detail. Keys vary by error class.
  - name: parameters.reason
    description: When present, a string enum naming a more specific sub-error.
  - name: parameters.description
    description: When present, a human-readable description of the sub-error.
statuses:
- status: 200
  meaning: Success. For consumer event endpoints see the asynchronous error handling note.
  action: Continue.
- status: 400
  meaning: Bad Request. The request body, parameters, or headers are invalid.
  action: Fix the request and retry.
  retryable: false
- status: 401
  meaning: Unauthorized. Missing or invalid access token.
  action: Acquire or refresh a token.
  retryable: false
- status: 402
  meaning: Payment Required. The feature is not enabled for this client.
  action: Check provisioning with your Extole guide.
- status: 403
  meaning: Forbidden. The token does not carry the required scope, or the resource is not accessible.
  action: Use a token with the correct scope.
  retryable: false
- status: 415
  meaning: Unsupported Media Type. The Content-Type header is missing or wrong.
  action: 'Set Content-Type: application/json.'
  retryable: false
- status: 429
  meaning: Too Many Requests. Rate limit exceeded.
  action: Back off exponentially and retry.
  retryable: true
- status: 500
  meaning: Server Error. Extole encountered an unexpected condition.
  action: Retry with backoff. If persistent, log unique_id and contact support.
  retryable: true
