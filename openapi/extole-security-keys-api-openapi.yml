                unsupported_media_type:
                  $ref: '#/components/examples/unsupported_media_type'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Unsupported Media Type
        '429':
          content:
            application/json:
              examples:
                too_many_requests:
                  $ref: '#/components/examples/too_many_requests'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Too Many Requests
      summary: List client keys
      tags:
      - Security Keys
      x-extole-bundle: management
      x-extole-visibility: visible
    post:
      description: Creates a client key from a JSON request body. Supported variants include OAuth integrations, inline PGP or SSH key material, JWT signing keys, webhook secrets, and generic password or HTTP basic credentials. Set `algorithm` to select the polymorphic request and response schema. Set `type` to classify what the key is used for.
      operationId: createClientKey
      requestBody:
        content:
          application/json:
            example:
              algorithm: A128KW
              component_ids:
              - component_id
              component_references:
              - component_id: component_id
                socket_names:
                - socket_name
              description: description
              key: key
              name: name
              partner_key_id: partner_key_id
              tags:
              - tag
              type: JWT
            schema:
              $ref: '#/components/schemas/StringBasedClientKeyCreateRequest'
      responses:
