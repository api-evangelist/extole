        message: Malformed webhook url
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    duplicate_user_subscription:
      summary: duplicate_user_subscription
      value:
        code: duplicate_user_subscription
        http_status_code: 403
        message: User subscription already exists
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
