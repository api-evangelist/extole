        unique_id: 00000000-0000-0000-0000-000000000000
    spel_expression_invalid_syntax:
      summary: spel_expression_invalid_syntax
      value:
        code: spel_expression_invalid_syntax
        http_status_code: 400
        message: Expression has invalid syntax and/or contains forbidden statements
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
  schemas:
    WebhookSubscriptionChannelRequest:
      allOf:
      - $ref: '#/components/schemas/SubscriptionChannelRequestBase'
      - properties:
          type:
            enum:
            - WEBHOOK
            type: string
