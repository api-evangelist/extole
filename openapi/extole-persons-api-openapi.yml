    PersonStepDataResponse:
      description: Named data parameters attached to this step.
      properties:
        name:
          description: Name of the data parameter.
          type: string
        scope:
          description: Visibility scope of the data parameter.
          enum:
          - CLIENT
          - PRIVATE
          - PUBLIC
          type: string
        value:
          description: Value stored for the data parameter.
          type: object
      type: object
    PersonLocationResponse:
      properties:
