        description:
          description: Text description of the shared content. Absent if not set.
          type: string
        image_url:
          description: URL of the image associated with the shared content. Absent if not set.
          type: string
        partner_content_id:
          description: Partner-assigned identifier for the shareable content item. Absent if not provided.
          type: string
        title:
          description: Display title for the shared content. Absent if not set.
