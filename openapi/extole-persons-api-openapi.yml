  schemas:
    PersonRewardDataResponse:
      description: Named data parameters attached to this reward.
      properties:
        name:
          description: Name of the data parameter.
          type: string
        value:
          description: Value stored for the data parameter.
          type: object
      type: object
    PersonShareDataResponse:
      description: Named data parameters attached to this share.
      properties:
        name:
          description: Name of the data parameter.
          type: string
        value:
          description: Value stored for the data parameter.
          type: object
      type: object
    IdentityLogResponseBase:
      properties:
        log_date:
          $ref: '#/components/schemas/ZonedDateTime'
        old_identity_key_name:
          description: Name of the identity key before the change. Absent if not applicable.
          type: string
        old_identity_key_value:
          description: Value of the identity key before the change. Absent if not applicable.
          type: string
        type:
          description: Type of identity event (`IDENTITY_SHIFT` or `SPLIT_LOSER`).
          enum:
          - IDENTITY_SHIFT
          - SPLIT_LOSER
          type: string
      type: object
    PersonRewardResponse:
      properties:
        campaign_id:
          description: Extole campaign id associated with this reward.
          type: string
        container:
          description: Campaign container the reward belongs to.
          type: string
        created_date:
          $ref: '#/components/schemas/ZonedDateTime'
        data:
          additionalProperties:
            $ref: '#/components/schemas/PersonRewardDataResponse'
          description: Named data parameters attached to this reward.
          type: object
        earned_date:
          $ref: '#/components/schemas/ZonedDateTime'
        expiry_date:
          $ref: '#/components/schemas/ZonedDateTime'
        face_value:
          description: Monetary or point face value of the reward.
          type: number
        face_value_type:
          description: Unit type of the face value (e.g. `CASH`, `POINTS`, `PERCENT`).
          enum:
          - AUD
          - BRL
          - CAD
          - CNY
          - EUR
          - GBP
          - HKD
          - INR
          - JPY
          - KRW
          - MONTH
          - MXN
          - NZD
          - PERCENT_OFF
          - POINTS
          - TRY
          - TWD
          - USD
          type: string
        id:
          description: Extole-assigned unique identifier for this reward.
          readOnly: true
          type: string
        journey_key:
          $ref: '#/components/schemas/JourneyKey'
        journey_name:
          description: Name of the journey associated with this reward.
          type: string
        name:
          description: Display name of the reward.
          type: string
        partner_reward_id:
          description: Partner-assigned identifier for this reward at the partner's system.
          type: string
        partner_reward_supplier_id:
          description: Partner-assigned identifier for the reward supplier.
          type: string
        program:
          description: Program key under which the reward was issued.
          type: string
        redeemed_date:
          $ref: '#/components/schemas/ZonedDateTime'
        reward_supplier_id:
          description: Extole reward supplier id that issued this reward.
          type: string
        sandbox:
          description: Sandbox identifier for this reward.
          type: string
        state:
          description: Current lifecycle state of the reward.
          enum:
          - CANCELED
          - EARNED
          - FAILED
          - FULFILLED
          - REDEEMED
          - REVOKED
          - SENT
          type: string
        tags:
          description: Tags applied to this reward.
          items:
            description: Tags applied to this reward.
            type: string
          type: array
        updated_date:
          $ref: '#/components/schemas/ZonedDateTime'
        value_of_rewarded_event:
          description: Monetary value of the event that triggered this reward.
          type: number
      required:
      - campaign_id
      - container
      - created_date
      - data
      - earned_date
      - expiry_date
      - face_value
      - face_value_type
      - id
      - journey_key
      - journey_name
      - name
      - partner_reward_id
      - partner_reward_supplier_id
      - program
      - redeemed_date
      - reward_supplier_id
      - sandbox
      - state
      - tags
      - updated_date
      - value_of_rewarded_event
      type: object
    PersonDataCreateRequest:
      description: Body of a `POST /v5/persons/{person_id}/data` request.
      properties:
        name:
          description: Name of the data parameter to create.
          type: string
        scope:
          description: Visibility scope of the data parameter. Defaults to PRIVATE when omitted.
          enum:
          - CLIENT
          - PRIVATE
          - PUBLIC
          type: string
        value:
          description: Value to store for the data parameter.
          type: object
      required:
      - name
      - value
      type: object
    PublicPersonStepResponse:
      properties:
        campaign_id:
          nullable: true
          type: string
        data:
          additionalProperties:
            type: object
          type: object
        event_date:
          type: string
        journey_name:
          nullable: true
          type: string
        program_label:
          nullable: true
          type: string
        step_name:
          type: string
      required:
      - campaign_id
      - data
      - event_date
      - journey_name
      - program_label
      - step_name
      type: object
    PersonRelationshipResponse:
      properties:
        campaign_id:
          description: Extole campaign id associated with this relationship. Absent when no campaign is linked.
          type: string
        cause_event_id:
          description: Id of the direct cause event for this relationship.
          type: string
        container:
          description: Campaign container in which the relationship was established.
          type: string
        created_date:
          $ref: '#/components/schemas/ZonedDateTime'
        data:
          additionalProperties:
            $ref: '#/components/schemas/PersonRelationshipDataResponse'
          description: Named data parameters attached to this relationship.
          type: object
        id:
          description: Extole-assigned unique identifier for this relationship.
          readOnly: true
          type: string
        my_role:
          description: This person's role in the relationship (`ADVOCATE` or `FRIEND`).
          enum:
          - ADVOCATE
          - FRIEND
          type: string
        other_person_id:
          description: Extole person id of the other party in the relationship.
          type: string
        program:
          description: Program key associated with this relationship. Absent for relationships with no program context.
          type: string
        root_event_id:
          description: Id of the root event that initiated this relationship.
          type: string
        updated_date:
          $ref: '#/components/schemas/ZonedDateTime'
      required:
      - campaign_id
      - cause_event_id
      - container
      - created_date
      - data
      - id
      - my_role
      - other_person_id
      - program
      - root_event_id
      - updated_date
      type: object
    GeoIp:
      properties:
        accuracyRadiusKm:
          format: int32
          nullable: true
          type: integer
        city:
          $ref: '#/components/schemas/City'
        country:
          $ref: '#/components/schemas/Country'
        ipAddress:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        state:
          $ref: '#/components/schemas/State'
        zipCode:
          nullable: true
          type: string
      type: object
    PersonShareableContentResponse:
      description: Rendered content (subject, message, etc.) for this shareable. Absent if no content template is configured.
