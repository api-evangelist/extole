          type: integer
        city:
          $ref: '#/components/schemas/City'
        country:
          $ref: '#/components/schemas/Country'
        created_date:
          $ref: '#/components/schemas/ZonedDateTime'
        device_id:
          description: Device identifier associated with the request.
