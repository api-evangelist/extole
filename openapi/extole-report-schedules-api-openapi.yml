  /v6/report-runners/{reportRunnerId}/latest/download{format}:
    get:
      description: Downloads the output of the most recent completed report produced by the specified report runner. Append a format extension to select the download format.
      operationId: downloadLatestReportForRunner
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
      - in: path
        name: format
        required: true
        schema:
          nullable: true
          pattern: (\.csv|\.json|\.jsonl|\.xlsx|\.psv|\.headless_csv|\.headless_psv)?
          type: string
      - in: path
        name: reportRunnerId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        schema:
          nullable: true
          type: string
      - in: query
        name: offset
        schema:
          nullable: true
          type: string
      - in: query
        name: filename
        schema:
          nullable: true
          type: string
      responses:
        '200':
          content:
