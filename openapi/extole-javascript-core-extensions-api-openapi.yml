          description: Too Many Requests
      summary: Create a JavaScript SDK core extension
      tags:
      - Javascript Core Extensions
      x-extole-bundle: management-expert
      x-extole-visibility: expert
  /v1/extended-cores/built:
    get:
      description: Returns all extended cores in their fully evaluated (built) runtime form, with all evaluatable fields resolved to their current values. Use this when the calling system needs the effective JavaScript payloads rather than the source definitions. Set `include_archived=true` to include archived extensions.
      operationId: listBuiltExtendedCores
      parameters:
      - description: Optional includeArchived filter
        in: query
        name: include_archived
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BuiltExtendedCoreResponse'
