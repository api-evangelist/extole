components:
  schemas:
    ValueInBuiltJourneyKeyResponse:
      description: 'The value as configured: a literal value, or an expression (type:string) when defined dynamically.'
      oneOf:
      - description: Literal value
        title: Static Value
        type: object
      - description: Handlebars expression with [JourneyKeyContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/journey/JourneyKeyContext.d.ts).
        example: handlebars@runtime:{{value}}
        externalDocs:
          description: JourneyKeyContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/journey/JourneyKeyContext.d.ts
        pattern: ^handlebars@runtime:.*
        title: Runtime - Handlebars
        type: string
      - description: Javascript expression with [JourneyKeyContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/journey/JourneyKeyContext.d.ts).
        example: javascript@runtime:function() { return context.get('value');}
        externalDocs:
          description: JourneyKeyContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/journey/JourneyKeyContext.d.ts
        pattern: ^javascript@runtime:.*
        title: Runtime - Javascript
        type: string
    DataInCampaignControllerActionScheduleResponse:
      description: 'The data as configured: a literal value, or an expression (type:string) when defined dynamically.'
      oneOf:
      - description: Literal data
        title: Static Value
        type: object
      - description: Handlebars expression with [ControllerBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts).
        example: handlebars@buildtime:{{data}}
        externalDocs:
          description: ControllerBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts
        pattern: ^handlebars@buildtime:.*
        title: Buildtime - Handlebars
        type: string
      - description: Javascript expression with [ControllerBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts).
        example: javascript@buildtime:function() { return context.getVariableContext().get('data');}
        externalDocs:
          description: ControllerBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts
        pattern: ^javascript@buildtime:.*
        title: Buildtime - Javascript
        type: string
      - description: Handlebars expression with [ScheduleActionContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/action/schedule/ScheduleActionContext.d.ts).
        example: handlebars@runtime:{{data}}
        externalDocs:
          description: ScheduleActionContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/action/schedule/ScheduleActionContext.d.ts
        pattern: ^handlebars@runtime:.*
        title: Runtime - Handlebars
        type: string
      - description: Javascript expression with [ScheduleActionContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/action/schedule/ScheduleActionContext.d.ts).
        example: javascript@runtime:function() { return context.get('data');}
        externalDocs:
          description: ScheduleActionContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/step/action/schedule/ScheduleActionContext.d.ts
        pattern: ^javascript@runtime:.*
        title: Runtime - Javascript
        type: string
    BuiltCampaignControllerActionSignalResponse:
      allOf:
      - $ref: '#/components/schemas/BuiltCampaignControllerActionResponseBase'
      - properties:
          action_type:
            enum:
            - SIGNAL
            type: string
          data:
            $ref: '#/components/schemas/DataMapInBuiltCampaignControllerActionSignalResponse'
          name:
            $ref: '#/components/schemas/NameInBuiltCampaignControllerActionSignalResponse'
          signal_polling_id:
            $ref: '#/components/schemas/SignalPollingIdInBuiltCampaignControllerActionSignalResponse'
        type: object
      required:
      - action_id
      - action_type
      - component_ids
      - component_references
      - data
      - enabled
      - name
      - quality
      - signal_polling_id
      type: object
    FilterScopeInCampaignControllerTriggerHasPriorRewardResponse:
      description: 'The filter scope as configured: a literal value, or an expression (type:string) when defined dynamically.'
      oneOf:
      - description: Literal filter scope
        enum:
        - CAMPAIGN
        - CLIENT
        - JOURNEY
        - PROGRAM
        title: Static Value
        type: string
      - description: Handlebars expression with [ControllerBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts).
        example: handlebars@buildtime:{{filterScope}}
        externalDocs:
          description: ControllerBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts
        pattern: ^handlebars@buildtime:.*
        title: Buildtime - Handlebars
        type: string
      - description: Javascript expression with [ControllerBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts).
        example: javascript@buildtime:function() { return context.getVariableContext().get('filterScope');}
        externalDocs:
          description: ControllerBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/campaign/ControllerBuildtimeContext.d.ts
        pattern: ^javascript@buildtime:.*
        title: Buildtime - Javascript
        type: string
    TagsInBuiltCampaignControllerActionEarnRewardResponse:
      description: 'The tags as configured: a literal value, or an expression (type:string) when defined dynamically.'
      oneOf:
      - description: Literal tags
        items:
          type: string
        title: Static Value
