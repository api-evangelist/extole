  /v2/reward-suppliers/manual-coupons/{reward_supplier_id}/coupons:
    get:
      description: Downloads the current coupon pool for the manual coupon supplier as a JSON response.
      operationId: downloadManualCoupons
      parameters:
      - in: path
        name: reward_supplier_id
        required: true
        schema:
          type: string
      - in: query
        name: operation_id
        schema:
          nullable: true
          type: string
      - in: query
        name: issued
        schema:
          nullable: true
          type: boolean
      - in: query
        name: include_expired
        schema:
          nullable: true
          type: boolean
      - in: query
        name: limit
        schema:
          nullable: true
          type: string
      - in: query
        name: offset
        schema:
          nullable: true
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCouponRewardSupplierDownloadCouponsResponse'
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                binding_error:
                  $ref: '#/components/examples/binding_error'
                invalid_expiration_date:
                  $ref: '#/components/examples/invalid_expiration_date'
