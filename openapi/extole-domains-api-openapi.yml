  schemas:
    ClientDomainPatternCreateRequest:
      description: Body of a `POST /v1/client-domain-patterns` request.
      properties:
        client_domain_id:
          type: string
        component_ids:
          items:
            type: string
          type: array
        component_references:
          items:
            $ref: '#/components/schemas/ComponentReferenceRequest'
          type: array
        pattern:
          $ref: '#/components/schemas/PatternInClientDomainPatternCreateRequest'
        test:
          $ref: '#/components/schemas/TestInClientDomainPatternCreateRequest'
        type:
          enum:
          - DOMAIN
          - GLOB
          - SUB_DOMAIN
          type: string
      required:
      - pattern
      type: object
    TestInClientDomainPatternResponse:
      description: Build-time expression that marks whether the pattern is used for test traffic only.
      oneOf:
      - description: Literal test
        title: Static Value
        type: boolean
      - description: Handlebars expression with [ClientDomainPatternBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts).
        example: handlebars@buildtime:{{test}}
        externalDocs:
          description: ClientDomainPatternBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts
        pattern: ^handlebars@buildtime:.*
        title: Buildtime - Handlebars
        type: string
      - description: Javascript expression with [ClientDomainPatternBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts).
        example: javascript@buildtime:function() { return context.getVariableContext().get('test');}
        externalDocs:
          description: ClientDomainPatternBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts
        pattern: ^javascript@buildtime:.*
        title: Buildtime - Javascript
        type: string
    ClientDomainCreateRequest:
      description: Body of a `POST /v1/client-domains` request.
      properties:
        cname_target:
          type: string
        domain:
          type: string
        name:
          type: string
        proxy:
          type: boolean
        redirect_client_domain_id:
          type: string
        share_uri:
          type: string
        ssl_certificate:
          type: string
        ssl_certificate_chain:
          type: string
        ssl_generation_policy:
          enum:
          - DISABLED
          - GENERATE
          - GENERATE_FORCE
          - PROVIDED
          type: string
        ssl_private_key:
          type: string
      required:
      - cname_target
      - domain
      - name
      - proxy
      - redirect_client_domain_id
      - share_uri
      - ssl_certificate
      - ssl_certificate_chain
      - ssl_generation_policy
      - ssl_private_key
      type: object
    PatternInClientDomainPatternResponse:
      description: Build-time expression that resolves to the domain pattern used for matching.
      oneOf:
      - allOf:
        - type: string
        - not:
            anyOf:
            - pattern: ^handlebars@buildtime:.*
              type: string
            - pattern: ^javascript@buildtime:.*
              type: string
          type: string
        description: Literal pattern
        title: Static Value
      - description: Handlebars expression with [ClientDomainPatternBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts).
        example: handlebars@buildtime:{{pattern}}
        externalDocs:
          description: ClientDomainPatternBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts
        pattern: ^handlebars@buildtime:.*
        title: Buildtime - Handlebars
        type: string
      - description: Javascript expression with [ClientDomainPatternBuildtimeContext](https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts).
        example: javascript@buildtime:function() { return context.getVariableContext().get('pattern');}
        externalDocs:
          description: ClientDomainPatternBuildtimeContext
          url: https://github.com/extole/extole-specification/blob/main/openapi/expression-context/com/extole/api/client/domain/pattern/ClientDomainPatternBuildtimeContext.d.ts
        pattern: ^javascript@buildtime:.*
        title: Buildtime - Javascript
        type: string
    ClientDomainPatternResponse:
      description: Client domain pattern source definition with build-time expressions and component references.
      properties:
        client_domain_id:
          description: Optional program domain identifier associated with this pattern.
          type: string
        component_ids:
          items:
            type: string
          type: array
        component_references:
          items:
            $ref: '#/components/schemas/ComponentReferenceResponse'
          type: array
        id:
          description: Unique identifier for the client domain pattern.
          readOnly: true
          type: string
        pattern:
          $ref: '#/components/schemas/PatternInClientDomainPatternResponse'
        test:
          $ref: '#/components/schemas/TestInClientDomainPatternResponse'
        type:
          description: Pattern matching type that controls how the pattern is interpreted.
          enum:
          - DOMAIN
          - GLOB
          - SUB_DOMAIN
          type: string
      required:
      - client_domain_id
      - component_ids
      - component_references
      - id
      - pattern
      - test
      - type
      type: object
    ClientDomainPatternUpdateRequest:
      description: Body of a `PUT /v1/client-domain-patterns/{id}` request.
      properties:
        client_domain_id:
          nullable: true
          type: object
        component_ids:
          items:
            type: string
          type: array
        component_references:
          items:
            $ref: '#/components/schemas/ComponentReferenceRequest'
          type: array
        pattern:
          $ref: '#/components/schemas/PatternInClientDomainPatternUpdateRequest'
        test:
          $ref: '#/components/schemas/TestInClientDomainPatternUpdateRequest'
        type:
          enum:
