openapi: 3.0.1
info:
  description: 'Consumer-to-Extole integration endpoints: consumer event submission, zone rendering, profile management, and SDK-backing operations for browser and native app environments.'
  title: Integration API - Consumer to Extole Audiences SFTP Servers API
  version: '1.0'
servers:
- description: Production
  url: https://{brand}.extole.io
  variables:
    brand:
      default: yourcompany
      description: Your Extole client subdomain (e.g. 'mycompany' for mycompany.extole.io)
security:
- HEADER: []
- QUERY: []
- COOKIE: []
tags:
- name: SFTP Servers
paths:
  /v6/sftp-destinations:
    get:
      description: Returns all SFTP destination connection profiles configured for the client.
      operationId: listSftpDestinations
      parameters:
      - in: query
        name: type
        schema:
          enum:
          - EXTERNAL
          - LOCAL
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      - in: query
        name: host
        schema:
          type: string
      - in: query
        name: limit
        schema:
          format: int32
          type: integer
      - in: query
        name: offset
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SftpDestinationResponse'
                type: array
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                binding_error:
                  $ref: '#/components/examples/binding_error'
                invalid_json:
                  $ref: '#/components/examples/invalid_json'
                invalid_parameter:
                  $ref: '#/components/examples/invalid_parameter'
                missing_request_body:
                  $ref: '#/components/examples/missing_request_body'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                method_unauthorized:
                  $ref: '#/components/examples/method_unauthorized'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Unauthorized
        '402':
          content:
            application/json:
              examples:
                payment_required:
                  $ref: '#/components/examples/payment_required'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Payment Required
        '403':
          content:
            application/json:
              examples:
                access_denied:
                  $ref: '#/components/examples/access_denied'
                method_unauthorized:
                  $ref: '#/components/examples/method_unauthorized'
                missing_access_token:
                  $ref: '#/components/examples/missing_access_token'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Forbidden
        '415':
          content:
            application/json:
              examples:
                unsupported_media_type:
                  $ref: '#/components/examples/unsupported_media_type'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Unsupported Media Type
        '429':
          content:
            application/json:
              examples:
                too_many_requests:
                  $ref: '#/components/examples/too_many_requests'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Too Many Requests
      summary: List SFTP destinations
      tags:
      - SFTP Servers
      x-extole-bundle: integration-server-to-extole
      x-extole-visibility: visible
    post:
      description: Creates a new SFTP destination connection profile used for automated report file delivery. Returns the created destination with its server-assigned id.
      operationId: createSftpDestination
      requestBody:
        content:
          application/json:
            example:
              dropbox_path: dropbox_path
              extole_key_id: extole_key_id
              host: host
              key_id: key_id
              name: name
              partner_key_id: partner_key_id
              port: 1
              type: EXTERNAL
              username: username
            schema:
              $ref: '#/components/schemas/SftpDestinationCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SftpDestinationResponse'
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                binding_error:
                  $ref: '#/components/examples/binding_error'
                external_sftp_destination_invalid_username:
                  $ref: '#/components/examples/external_sftp_destination_invalid_username'
                invalid_json:
                  $ref: '#/components/examples/invalid_json'
                invalid_parameter:
                  $ref: '#/components/examples/invalid_parameter'
                local_sftp_destination_invalid_username:
                  $ref: '#/components/examples/local_sftp_destination_invalid_username'
                missing_request_body:
                  $ref: '#/components/examples/missing_request_body'
                sftp_destination_client_key_not_found:
                  $ref: '#/components/examples/sftp_destination_client_key_not_found'
                sftp_destination_duplicated_name:
                  $ref: '#/components/examples/sftp_destination_duplicated_name'
                sftp_destination_duplicated_username:
                  $ref: '#/components/examples/sftp_destination_duplicated_username'
                sftp_destination_invalid_dropbox_path:
                  $ref: '#/components/examples/sftp_destination_invalid_dropbox_path'
                sftp_destination_invalid_host:
                  $ref: '#/components/examples/sftp_destination_invalid_host'
                sftp_destination_invalid_key_content:
                  $ref: '#/components/examples/sftp_destination_invalid_key_content'
                sftp_destination_invalid_key_type:
                  $ref: '#/components/examples/sftp_destination_invalid_key_type'
                sftp_destination_invalid_name:
                  $ref: '#/components/examples/sftp_destination_invalid_name'
                sftp_destination_invalid_port:
                  $ref: '#/components/examples/sftp_destination_invalid_port'
                sftp_destination_missing_host:
                  $ref: '#/components/examples/sftp_destination_missing_host'
                sftp_destination_missing_key_id:
                  $ref: '#/components/examples/sftp_destination_missing_key_id'
                sftp_destination_missing_username:
                  $ref: '#/components/examples/sftp_destination_missing_username'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                method_unauthorized:
                  $ref: '#/components/examples/method_unauthorized'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Unauthorized
        '402':
          content:
            application/json:
              examples:
                payment_required:
                  $ref: '#/components/examples/payment_required'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Payment Required
        '403':
          content:
            application/json:
              examples:
                access_denied:
                  $ref: '#/components/examples/access_denied'
                method_unauthorized:
                  $ref: '#/components/examples/method_unauthorized'
                missing_access_token:
                  $ref: '#/components/examples/missing_access_token'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Forbidden
        '415':
          content:
            application/json:
              examples:
                unsupported_media_type:
                  $ref: '#/components/examples/unsupported_media_type'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Unsupported Media Type
        '429':
          content:
            application/json:
              examples:
                too_many_requests:
                  $ref: '#/components/examples/too_many_requests'
              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Too Many Requests
      summary: Create an SFTP destination
      tags:
      - SFTP Servers
      x-extole-bundle: integration-server-to-extole
      x-extole-visibility: visible
