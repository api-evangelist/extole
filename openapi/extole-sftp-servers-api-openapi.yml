components:
  examples:
    invalid_json:
      summary: invalid_json
      value:
        code: invalid_json
        http_status_code: 400
        message: JSON is invalid
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    sftp_destination_invalid_dropbox_path:
      summary: sftp_destination_invalid_dropbox_path
      value:
        code: sftp_destination_invalid_dropbox_path
        http_status_code: 400
        message: Dropbox path is not valid. Dropbox path is valid if not empty or blank, not longer than 255 characters and is a valid system path
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    sftp_destination_missing_key_id:
      summary: sftp_destination_missing_key_id
      value:
        code: sftp_destination_missing_key_id
        http_status_code: 400
        message: Key id is mandatory
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    sftp_destination_invalid_host:
      summary: sftp_destination_invalid_host
      value:
        code: sftp_destination_invalid_host
        http_status_code: 400
        message: Host is not a valid domain
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    sftp_destination_duplicated_username:
      summary: sftp_destination_duplicated_username
      value:
        code: sftp_destination_duplicated_username
        http_status_code: 400
        message: Sftp destination with such username already exists
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    payment_required:
      summary: payment_required
      value:
        code: payment_required
        http_status_code: 402
        message: The access_token provided is associated with an unpaid account.
        parameters: {}
        unique_id: 00000000-0000-0000-0000-000000000000
    missing_access_token:
      summary: missing_access_token
      value:
