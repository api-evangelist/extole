              schema:
                $ref: '#/components/schemas/RestExceptionResponse'
          description: Too Many Requests
      tags:
      - Content
      x-extole-bundle: integration-consumer-to-extole
      x-extole-visibility: expert
  /web/me/assets/{assetId}/download:
    get:
      operationId: downloadAssetById_2
      parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: string
      - in: query
