    OAuthFlowCodeExchangeRequest:
      properties:
        client_key_id:
          type: string
        code:
          type: string
        key_type:
          enum:
          - STANDARD
          type: string
        redirect_uri:
          type: string
      required:
      - client_key_id
      - code
      - redirect_uri
      type: object
    AccessTokenResponse:
      description: Access-token metadata returned by `POST /v4/tokens`, `POST /v4/tokens/openid-connect/authorization-code-flow`, `GET /v4/tokens`, `GET /v4/tokens/{token}`, and `PUT /v4/tokens/exchange/{token}`. Pass `access_token` in the `Authorization` header (`Bearer ...`) on subsequent requests.
      properties:
        access_token:
          description: 'Token string. Send as `Authorization: Bearer <access_token>` on subsequent requests, or as the `access_token` query parameter / `extole_token` cookie.'
          type: string
        client_id:
          description: Stable Extole identifier for the client (tenant) this token authenticates against.
          type: string
        expires_in:
          description: Seconds until this token expires. Once expired, requests using it return `401 invalid_access_token`; rotate via `PUT /v4/tokens/exchange/{token}` before expiry to keep long-lived integrations alive.
          format: int64
          type: integer
        identity_id:
          description: Stable Extole identifier for the identity (user, managed identity, or resource) that this token represents.
          type: string
        person_id:
          deprecated: true
          description: Deprecated alias for `identity_id`. New integrations should use `identity_id`.
          type: string
        scopes:
          description: Authorization scopes granted to this token. Determines which API operations the token may invoke.
          items:
            description: Authorization scopes granted to this token. Determines which API operations the token may invoke.
            enum:
            - BACKEND
            - CLIENT_ADMIN
            - CLIENT_REPORT_DOWNLOAD
            - CLIENT_SUPERUSER
            - ONE_TIME
            - PASSWORD_RESET
            - UPDATE_PROFILE
            - USER_SUPPORT
            - VERIFIED_CONSUMER
            type: string
          type: array
          uniqueItems: true
        type:
          description: Authentication shape backing the token. `USER` represents a human dashboard user, `MANAGED` an OAuth-style managed identity, and `RESOURCE` a scoped per-resource token.
          enum:
          - MANAGED
          - RESOURCE
          - USER
          type: string
      type: object
    AuthCodeManagedAccessTokenCreationRequest:
      properties:
