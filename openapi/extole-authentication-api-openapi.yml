      - expires_in
      - scopes
      type: object
    AccessTokenCreationRequest:
      description: Optional body for `POST /v4/tokens`. Omit the body entirely to mirror the calling identity's scopes; supply a body to bind the new token to a specific `client_id`, narrow its `scopes`, override the default lifetime via `duration_seconds`, or authenticate with email/password credentials in lieu of a calling token.
      properties:
        client_id:
          description: Stable Extole identifier for the client (tenant) the new token should authenticate against. Required when authenticating with email/password credentials; optional when the calling identity already implies the client.
          type: string
        duration_seconds:
          description: Override the default token lifetime, in seconds. Must keep the token's expiry within the next ten millennia; out-of-range values return `400 invalid_duration` with the default lifetime in `default_duration`.
          format: int64
          nullable: true
          type: integer
        email:
          description: Email address of the dashboard user to authenticate. Pair with `password`. Returns `403 invalid_credentials` if the pair is wrong.
          nullable: true
          type: string
        password:
          description: Password for the dashboard user identified by `email`. Returns `403 invalid_credentials` if wrong, `403 expired_credentials` if expired, `403 account_locked` if the account is locked, and `403 account_disabled` if disabled.
          nullable: true
          type: string
        scopes:
          description: Subset of the calling identity's scopes to grant on the new token. Must be a strict subset; requesting a privilege the caller does not hold returns `403 scopes_denied` with the offending scopes in `denied_scopes`. Omit to mirror the caller's scopes.
          items:
            description: Subset of the calling identity's scopes to grant on the new token. Must be a strict subset; requesting a privilege the caller does not hold returns `403 scopes_denied` with the offending scopes in `denied_scopes`. Omit to mirror the caller's scopes.
            enum:
            - BACKEND
            - CLIENT_ADMIN
            - CLIENT_REPORT_DOWNLOAD
            - CLIENT_SUPERUSER
            - ONE_TIME
            - PASSWORD_RESET
            - UPDATE_PROFILE
            - USER_SUPPORT
            - VERIFIED_CONSUMER
            type: string
          nullable: true
          type: array
          uniqueItems: true
      required:
      - client_id
      - duration_seconds
      - email
      - password
      - scopes
      type: object
    AccessTokenResourceResponse:
