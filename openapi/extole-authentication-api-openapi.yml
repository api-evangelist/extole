    TokenResponse:
      properties:
        access_token:
          description: Opaque access token for the consumer session. Pass as a Bearer token or `access_token` query parameter on subsequent requests.
          type: string
        expires_in:
          description: Seconds until the token expires.
          format: int64
          type: integer
        scopes:
          description: Set of permission scopes granted to this token.
