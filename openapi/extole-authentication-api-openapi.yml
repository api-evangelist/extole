            - CLIENT_SUPERUSER
            - ONE_TIME
            - PASSWORD_RESET
            - UPDATE_PROFILE
            - USER_SUPPORT
            - VERIFIED_CONSUMER
            type: string
          type: array
          uniqueItems: true
      required:
