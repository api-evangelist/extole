    CreateTokenRequest:
      properties:
        duration_seconds:
          description: Requested token lifetime in seconds. Defaults to the client configuration value when omitted.
          format: int64
          nullable: true
          type: integer
        email:
          description: Email address used to identify or create the consumer. Ignored when `jwt` is present.
          nullable: true
          type: string
        jwt:
          description: Signed JWT carrying consumer identity claims. When supplied, identity is derived from the token claims rather than from `email`.
          nullable: true
