      type: object
    AuthCodeResponseValidateRequest:
      description: Body of `POST /v4/tokens/openid-connect/authorization-code-flow`. Pair with the `X-CSRF-TOKEN` and `X-NONCE` headers minted alongside the authorization-code response.
      properties:
        code:
          description: Authorization code received from the OpenID Connect provider. Validated alongside the `X-CSRF-TOKEN` and `X-NONCE` headers; missing or expired codes return `403 authorization_code_response_invalid`.
          type: string
        state:
          description: Opaque state value the relying party round-tripped through the authorization-code flow. Must match the value the relying party generated when starting the flow; mismatches return `403 authorization_code_missing_state`.
          type: string
      required:
      - code
      - state
      type: object
    RestExceptionResponse:
      description: Represents the API error response
      properties:
        code:
          description: Specific error code for this error type, documented per endpoint
          type: string
        http_status_code:
          description: HTTP status code that was returned with this error, useful if client get response code
          format: int32
          type: integer
        message:
          description: User readable English description of the error
          type: string
        parameters:
          additionalProperties:
            description: Attributes related to the error, varies be error code, documented per endpoint
            type: object
          description: Attributes related to the error, varies be error code, documented per endpoint
          type: object
        unique_id:
          description: Unique id associated with this error, useful for discussions with Extole
          type: string
      required:
      - code
      - http_status_code
      - message
      - parameters
      - unique_id
      type: object
    SuccessResponse:
      properties:
