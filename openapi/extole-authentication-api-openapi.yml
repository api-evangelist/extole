          description: Opaque consumer access token these details describe.
          type: string
        client_id:
          description: Identifier of the client that owns the token.
          type: string
        expired:
          description: True when the token is no longer valid, whether it lapsed on its own or was invalidated.
          type: boolean
        expires_at:
          $ref: '#/components/schemas/ZonedDateTime'
        invalidated:
          description: True when the token was explicitly invalidated (revoked), as opposed to expiring on its own. Detected when updated_at is later than expires_at.
          type: boolean
        person_id:
          description: Identifier of the person the token represents.
          type: string
        scopes:
          description: Permission scopes granted to the token.
          items:
            description: Permission scopes granted to the token.
            type: string
          type: array
          uniqueItems: true
        updated_at:
          $ref: '#/components/schemas/ZonedDateTime'
      required:
