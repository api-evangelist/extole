        data_source:
          $ref: '#/components/schemas/BatchJobDataSourceRequest'
        default_event_name:
          description: Fallback event name used when a row does not supply its own event name. Applied when `event_name` is omitted and no `event_name` column is present in the row.
          type: string
        event_columns:
          description: Column names in the data source whose values are used as event column values when dispatching each row. For example, `["person_id"]` will pass the row's `person_id` value as the identity key for event dispatch.
          items:
            description: Column names in the data source whose values are used as event column values when dispatching each row. For example, `["person_id"]` will pass the row's `person_id` value as the identity key for event dispatch.
            type: string
