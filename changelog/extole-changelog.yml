note: >-
  Extole publishes no dated, human-readable API changelog page. What it does publish is versioned
  RELEASE STREAMS for the artifacts that carry the contract — the @extole/specification npm package
  (the OpenAPI documents and Postman collections, released through release-please) and the @extole/cli
  package. Those are the closest thing to a change record an integrator can subscribe to, and they are
  dated, so they are captured here. Two dated release streams and no narrative changelog is the honest
  shape of this provider; nothing is invented to fill a changelog page that does not exist.
